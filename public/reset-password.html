<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Light grey background like your login */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-card h2 {
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-label {
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }
        .form-control {
            border-radius: 5px;
            padding: 10px;
            border: 1px solid #ddd;
        }
        .btn-login {
            background-color: #1e7e4e; /* The specific Green from your Login button */
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 5px;
            transition: background 0.3s;
            color: white;
        }
        .btn-login:hover {
            background-color: #166a41;
            color: white;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .footer-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Reset Password</h2>
    
    <div class="mb-3">
        <label for="newPass" class="form-label">New Password</label>
        <input type="password" id="newPass" class="form-control" placeholder="Enter new password">
    </div>

    <button onclick="update()" class="btn btn-login w-100 mt-3">Update Password</button>

    <div class="footer-link">
        <span class="text-muted">Remembered it?</span> <a href="login.html">Login</a>
    </div>
</div>

<script>
async function update() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const password = document.getElementById('newPass').value;

    if (!password) {
        alert("Please enter a new password.");
        return;
    }

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (res.ok) {
            alert("Password updated successfully!");
            window.location.href = "login.html";
        } else {
            alert(data.message || "Invalid or expired link.");
        }
    } catch (error) {
        alert("An error occurred. Please try again.");
    }
}
</script>

</body>
</html>
