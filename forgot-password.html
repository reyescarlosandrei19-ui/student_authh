<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px;">
            <h3 class="text-center mb-3">Forgot Password</h3>
            <p class="text-muted text-center small">Enter your Gmail address and we'll check your account type.</p>

            <div id="message-display" class="mt-2"></div>

            <div class="mb-3 mt-3">
                <label for="email" class="form-label">Gmail Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@gmail.com" required>
            </div>

            <div class="g-recaptcha mb-3" data-sitekey="6Lf1OKssAAAAAHZjPXmyUH744lCv-6ZUZ1ecpJDz"></div>

            <button onclick="handleForgotRequest()" class="btn btn-success w-100 py-2">Check Account</button>
            
            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none small">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        async function handleForgotRequest() {
            const email = document.getElementById('email').value;
            const captchaResponse = grecaptcha.getResponse();
            const messageDiv = document.getElementById('message-display');

            if (!email) {
                messageDiv.innerHTML = `<div class="alert alert-warning p-2 small">Please enter your email.</div>`;
                return;
            }

            if (!captchaResponse) {
                messageDiv.innerHTML = `<div class="alert alert-warning p-2 small">Please complete the CAPTCHA.</div>`;
                return;
            }

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, captchaResponse })
                });

                const data = await response.json();

                if (response.status === 400 && data.isGoogleUser) {
                    // SMART MESSAGE: For Google Authenticated Accounts
                    messageDiv.innerHTML = `
                        <div class="alert alert-info border-info p-3">
                            <strong>Google Login Detected</strong><br>
                            <span class="small">${data.message}</span>
                            <div class="mt-2">
                                <a href="login.html" class="btn btn-info btn-sm w-100">Use Google Login Instead</a>
                            </div>
                        </div>`;
                } else if (response.ok) {
                  
                    messageDiv.innerHTML = `<div class="alert alert-success p-2 small">${data.message}</div>`;
                } else {
               
                    messageDiv.innerHTML = `<div class="alert alert-danger p-2 small">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger p-2 small">Connection failed. Try again later.</div>`;
            }
        }
    </script>
</body>
</html>
