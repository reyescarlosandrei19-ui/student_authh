<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      
        @media (max-width: 576px) {
            .g_id_signin iframe {
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="w-100" style="max-width: 400px;">

            <!-- Alert ABOVE the card -->
            <div id="message" class="alert d-none"></div>

            <div class="card p-4 shadow">
                <h3 class="text-center mb-4">Login</h3>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password">
                </div>

                <button onclick="login()" class="btn btn-success w-100">Login</button>
                <div class="text-center mt-2"><a href="forgot-password.html" class="small">Forgot Password?</a> </div>

                <div class="text-center my-3 text-muted">OR</div>

                <div id="g_id_onload"
                     data-client_id="315728662178-7r4r0udjpefo5nklkfogfavch6qiot5c.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin">
                </div>
                <!-- ✅ data-width changed to 100% friendly value -->
                <div class="g_id_signin d-flex justify-content-center" data-type="standard" data-width="100%"></div>

                <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
            </div>

        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('registered') === 'true') {
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'alert alert-success';
                messageDiv.textContent = '✅ Account registered successfully! Please log in.';
            }
        });

       async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');

    // ---  VALIDATE INPUTS ---
    if (!email || !password) {
        messageDiv.className = 'alert alert-warning';
        messageDiv.classList.remove('d-none'); // Ensure alert is visible
        messageDiv.textContent = '⚠️ Please enter both your email and password.';
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        handleResponse(response, data);
    } catch (error) {
        console.error("Fetch error:", error);
        messageDiv.className = 'alert alert-danger';
        messageDiv.classList.remove('d-none');
        messageDiv.textContent = 'Could not connect to the server.';
    }
}

        async function handleGoogleLogin(googleResponse) {
            const response = await fetch('http://localhost:3000/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: googleResponse.credential })
            });

            const data = await response.json();
            handleResponse(response, data);
        }

        function handleResponse(response, data) {
    const messageDiv = document.getElementById('message');

    if (response.ok) {
        messageDiv.className = 'alert alert-success';
        messageDiv.textContent = '✅ Login successful! Redirecting...';
        
        // --- UPDATED SECTION ---
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role); // 👈 ADD THIS LINE
        // -----------------------

        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1500);
    } else {
        messageDiv.className = 'alert alert-danger';
        messageDiv.textContent = data.message || 'Login failed.';
    }
}
    </script>
</body>
</html>
