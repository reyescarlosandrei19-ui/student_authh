<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h3 class="text-center mb-4">Login</h3>

            <div id="message" class="alert d-none"></div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
            </div>

            <button onclick="login()" class="btn btn-success w-100">Login</button>

            <div class="text-center my-3 text-muted">OR</div>
            
            <div id="g_id_onload"
                 data-client_id="315728662178-7r4r0udjpefo5nklkfogfavch6qiot5c.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin">
            </div>
            <div class="g_id_signin" data-type="standard" data-width="350"></div>

            <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>

    <script>
        // Existing Login Function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const response = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            handleResponse(response, data);
        }

        // 3. New Google Login Handler
        async function handleGoogleLogin(googleResponse) {
            const messageDiv = document.getElementById('message');
            
            const response = await fetch('http://localhost:3000/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: googleResponse.credential })
            });

            const data = await response.json();
            handleResponse(response, data);
        }

        // Helper to handle the UI update after login
        function handleResponse(response, data) {
            const messageDiv = document.getElementById('message');
            messageDiv.classList.remove('d-none', 'alert-success', 'alert-danger');

            if (response.ok) {
                messageDiv.classList.add('alert-success');
                messageDiv.textContent = 'Login successful! Redirecting...';
                localStorage.setItem('token', data.token);
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                messageDiv.classList.add('alert-danger');
                messageDiv.textContent = data.message || 'Login failed';
            }
        }
    </script>
</body>
</html>
