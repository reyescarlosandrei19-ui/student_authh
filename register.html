<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        /* Make reCAPTCHA scale on small screens */
        @media (max-width: 400px) {
            .g-recaptcha {
                transform: scale(0.85);
                transform-origin: 0 0;
            }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="w-100" style="max-width: 400px;">

            <!-- Alert ABOVE the card -->
            <div id="message" class="alert d-none"></div>

            <div class="card p-4 p-md-4 shadow">
                <h3 class="text-center mb-4">Register</h3>

                <form id="registrationForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <div class="mb-3 overflow-hidden">
                        <div class="g-recaptcha" data-sitekey="6Lf1OKssAAAAAHZjPXmyUH744lCv-6ZUZ1ecpJDz"></div>
                    </div>

                    <button type="button" onclick="register()" class="btn btn-success w-100">Register</button>
                </form>
                <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
            </div>

        </div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const captchaToken = grecaptcha.getResponse();

            if (!captchaToken) {
                messageDiv.className = 'alert alert-warning';
                messageDiv.textContent = '⚠️ Please complete the CAPTCHA first.';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        'g-recaptcha-response': captchaToken
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = 'login.html?registered=true';
                } else {
                    messageDiv.className = 'alert alert-danger';
                    messageDiv.textContent = data.message || 'Registration failed.';
                    grecaptcha.reset();
                }
            } catch (error) {
                console.error("Fetch error:", error);
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Could not connect to the server.';
            }
        }
    </script>

</body>
</html>
