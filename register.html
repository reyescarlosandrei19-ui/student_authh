<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h3 class="text-center mb-4">Register</h3>

            <div id="message" class="alert d-none"></div>

            <form id="registrationForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>

                <div class="mb-3">
                    <div class="g-recaptcha" data-sitekey="6LdEyaosAAAAAFMjJe4wG_LiA3TRHIx7ZPHfMeFL"></div>
                </div>

                <button type="button" onclick="register()" class="btn btn-success w-100">Register</button>
            </form>
            <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script>
      async function register() {
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // 1. Manually get the reCAPTCHA token from the widget
    const captchaToken = grecaptcha.getResponse();

    if (!captchaToken) {
        alert("Please complete the CAPTCHA first.");
        return;
    }

    try {
        const response = await fetch('/api/auth/register', { // Update this URL to match your route
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username,
                email,
                password,
                'g-recaptcha-response': captchaToken // 2. Send the token to the backend
            })
        });

        const data = await response.json();
        if (response.ok) {
            alert("Registration successful!");
            window.location.href = 'login.html';
        } else {
            alert("Error: " + data.message);
            // Reset CAPTCHA so the user can try again
            grecaptcha.reset();
        }
    } catch (error) {
        console.error("Fetch error:", error);
        alert("Could not connect to the server.");
    }
}
    </script>

</body>
</html>
